# docker-compose.yml
services:

  mysql:
    image: mysql:8.0.37
    container_name: airpulse_bd
    restart: "no"
    command: --performance-schema=OFF --innodb-buffer-pool-size=64M
    environment:
      - MYSQL_ROOT_PASSWORD=Urubu100
      - MYSQL_DATABASE=airpulse
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
      # Roda só quando o volume está vazio (1ª subida ou após --reset-db).
      # Mesmo caminho relativo no repo local e na EC2 (o deploy.sh espelha a pasta).
      - ./src/database/scriptBd.sql:/docker-entrypoint-initdb.d/01-scriptBd.sql:ro
    networks:
      - airpulse_net

  node:
    image: mateusloualmeida/airpulse_deploy:airpulse
    container_name: airpulse_node_prod
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - AMBIENTE_PROCESSO=producao
      - DB_HOST=airpulse_bd
      - DB_PORT=3306
      - DB_DATABASE=airpulse
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_PORT=3333
      - APP_HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - aws_s3_bucket=${aws_s3_bucket:?Informe aws_s3_bucket no .env local e execute deploy.sh}
      - aws_region=${aws_region:-us-east-1}
      - aws_s3_alertas_prefix=${aws_s3_alertas_prefix:-03-gold/}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_ALERT_PROJECT_KEY=${JIRA_ALERT_PROJECT_KEY:-}
    depends_on:
      - mysql
    networks:
      - airpulse_net

  alertas-java:
    build: ./alertas-java
    container_name: airpulse_java_alertas
    restart: unless-stopped
    environment:
      - aws_s3_bucket=${aws_s3_bucket:?Informe aws_s3_bucket no .env local e execute deploy.sh}
      - aws_region=${aws_region:-us-east-1}
      - aws_s3_alertas_prefix=${aws_s3_alertas_prefix:-03-gold/}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_ALERT_PROJECT_KEY=${JIRA_ALERT_PROJECT_KEY:-}
      - JIRA_ALERT_ISSUE_TYPE=${JIRA_ALERT_ISSUE_TYPE:-Task}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
    networks:
      - airpulse_net


networks:
  airpulse_net:
    external: true

volumes:
  mysql_volume:
    external: true