<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboardFmcPrincipal.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>AirPulse - Monitoramento da placa</title>
    <link rel="stylesheet" href="css/painel.css">
</head>

<body>
    <div class="appLayout">

        <aside id="sidebar">
            <div class="sidebarHeader">
                <a class="sidebarBrand" href="dashboardPrincipalAnalista.html">
                    <img class="brandLogoFull"
                        src="assets/AirPulse_Logo_Pack/Fundo transparente/07_Principal_Branco.svg" alt="AirPulse">
                </a>
            </div>

            <nav class="sidebarNav">
                <a href="dashboardPrincipalAnalista.html" class="navItem active" aria-current="location">
                    <i class="bi bi-grid-1x2 navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>

                <div class="navItem disabled">
                    <i class="bi bi-cpu navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Componentes</span>
                </div>

                <a href="cadastroRelatorio.html" class="navItem" id="itemRelatorios">
                    <i class="bi bi-file-earmark-text navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Relatórios</span>
                </a>

                <a href="cadastroFuncionario.html" class="navItem" id="itemCadastrarFuncionario">
                    <i class="bi bi-people navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Cadastrar Funcionário</span>
                </a>

                <div class="navItem disabled">
                    <i class="bi bi-question-circle navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Chamados & Suporte</span>
                </div>
            </nav>

            <div class="sidebarFooter">
                <div class="userProfile">
                    <div class="userAvatar" id="userAvatar">--</div>
                    <div class="userDetails">
                        <span class="userName" id="userNameDisplay">Usuário</span>
                        <span class="userRole" id="userRoleDisplay"></span>
                    </div>
                </div>

                <button class="btnLogout" type="button" onclick="limparSessao()" title="Encerrar sessão no sistema">
                    <i class="bi bi-box-arrow-right" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Deslogar</span>
                </button>
            </div>
        </aside>
        <div class="sidebarBackdrop" id="sidebarBackdrop"></div>

        <div class="mainWrapper">

            <header class="topbar">
                <div class="topbarLeft">
                    <button class="mobileToggle" id="mobileToggle" type="button" aria-label="Abrir menu">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                    <span class="topbarTitle">Monitoramento da placa</span>
                </div>
            </header>

            <main class="painel dashboard">
                <div>
                    <h1>Monitoramento da placa</h1>
                    <p class="subtitulo">Placa P01 · FMC 1 · PR-GOL · Boeing 737</p>
                </div>

                <section class="gradeIndicadores" id="indicadoresPlaca" aria-label="Uso atual dos componentes"></section>

                <section class="gradeMeio">

                    <div class="cartao">
                        <div class="alertasTopo">
                            <span class="tituloCard" id="tituloAlertasPeriodo">Alertas nas últimas 24 horas</span>
                            <a class="btnHistoricoAlertas" href="alertas.html">Histórico de alertas</a>
                        </div>
                        <div id="alertasPlaca"></div>
                    </div>

                    <div class="cartao">
                        <div class="graficoTopo">
                            <div>
                                <span class="tituloCard">Consumo de recursos</span>
                                <p class="subtitulo" id="descricaoPeriodoGrafico">Leituras a cada minuto · Picos por período</p>
                            </div>
                            <div class="abas" id="abasComponentes" aria-label="Componente do gráfico">
                                <button class="ativa" type="button" data-componente="cpu" aria-pressed="true">CPU</button>
                                <button type="button" data-componente="ram" aria-pressed="false">RAM</button>
                                <button type="button" data-componente="disco" aria-pressed="false">Armazenamento</button>
                            </div>
                        </div>
                        <div class="periodosGrafico" role="group" aria-label="Período dos dados">
                            <span>Período</span>
                            <button type="button" data-periodo="1" aria-pressed="false">1 hora</button>
                            <button type="button" data-periodo="6" aria-pressed="false">6 horas</button>
                            <button class="selecionado" type="button" data-periodo="24" aria-pressed="true">24 horas</button>
                        </div>
                        <div class="graficoArea">
                            <svg id="graficoComponente" viewBox="0 0 620 280" font-size="11" fill="#6b7280" role="img" aria-labelledby="tituloGrafico descricaoGrafico"></svg>
                        </div>
                    </div>

                </section>

                <section class="gradeDetalhes" id="detalhesPlaca" aria-label="Estatísticas do último voo"></section>
            </main>
        </div>
    </div>

    <script src="js/sessao.js"></script>
    <script>validarSessao();</script>
    <script src="js/menuLateral.js"></script>
    <script src="js/dadosPlaca.js"></script>
    <script src="js/telaAnalista.js"></script>
</body>

</html>
