<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboardAnaliseFmcAnalista.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>AirPulse - Análise dos FMCs</title>
    <link rel="stylesheet" href="css/painel.css">
</head>

<body>

    <div class="appLayout">
        <aside id="sidebar">
            <div class="sidebarHeader">
                <a class="sidebarBrand" href="dashboardPrincipalAnalista.html">
                    <img class="brandLogoFull"
                        src="assets/AirPulse_Logo_Pack/Fundo transparente/07_Principal_Branco.svg" alt="AirPulse">
                </a>
            </div>

            <nav class="sidebarNav">
                <a href="dashboardPrincipalAnalista.html" class="navItem active" aria-current="location">
                    <i class="bi bi-grid-1x2 navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Dashboard</span>
                </a>

                <div class="navItem disabled">
                    <i class="bi bi-cpu navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Componentes</span>
                </div>

                <a href="cadastroRelatorio.html" class="navItem" id="itemRelatorios">
                    <i class="bi bi-file-earmark-text navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Relatórios</span>
                </a>

                <a href="cadastroFuncionario.html" class="navItem" id="itemCadastrarFuncionario">
                    <i class="bi bi-people navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Cadastrar Funcionário</span>
                </a>

                <div class="navItem disabled">
                    <i class="bi bi-question-circle navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Chamados & Suporte</span>
                </div>
            </nav>

            <div class="sidebarFooter">
                <div class="userProfile">
                    <div class="userAvatar" id="userAvatar">--</div>
                    <div class="userDetails">
                        <span class="userName" id="userNameDisplay">Usuário</span>
                        <span class="userRole" id="userRoleDisplay"></span>
                    </div>
                </div>

                <button class="btnLogout" type="button" onclick="limparSessao()" title="Encerrar sessão no sistema">
                    <i class="bi bi-box-arrow-right" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Deslogar</span>
                </button>
            </div>
        </aside>
        <div class="sidebarBackdrop" id="sidebarBackdrop"></div>
        <div class="mainWrapper">
            <header class="topbar">
                <div class="topbarLeft"><button class="mobileToggle" id="mobileToggle" type="button"
                        aria-label="Abrir menu"><i class="bi bi-list" aria-hidden="true"></i></button><span
                        class="topbarTitle">Análise dos FMCs</span></div>
            </header>
            <main class="conteudoAnalise dashboard">
                <header class="cabecalhoAnalise">
                    <div>
                        <h1 id="tituloAeronave">Aeronave PR-GOL</h1>
                        <p>Dados demonstrativos · Última coleta às 23:59 · Atenção: 70% · Crítico: 90%</p>
                    </div>
                </header>
                <section class="indicadoresAnalise" aria-label="Resumo dos equipamentos">
                    <article class="cartaoIndicador">
                        <div class="iconeIndicador laranja"><i class="bi bi-cpu iconeAnalise" aria-hidden="true"></i>
                        </div>
                        <div>
                            <h2>Placas em alerta agora</h2><strong class="valorIndicador" id="totalPlacasAlerta">—</strong>
                        </div>
                    </article>
                    <article class="cartaoIndicador">
                        <div class="iconeIndicador vermelho"><i class="bi bi-exclamation-triangle iconeAnalise"
                                aria-hidden="true"></i></div>
                        <div>
                            <h2>Críticos nas últimas 24 horas</h2><strong class="valorIndicador critico" id="totalCriticosFmc">—</strong>
                        </div>
                    </article>
                </section>
                <section class="gradeFmc" id="listaFmcs" aria-label="Comparação dos computadores de gerenciamento de voo"></section>
            </main>
        </div>
    </div>
    <script src="js/sessao.js"></script>
    <script>validarSessao();</script>
    <script src="js/menuLateral.js"></script>
    <script src="js/dadosPlaca.js"></script>
    <script src="js/dashboardAnaliseFmcAnalista.js"></script>
</body>

</html>
