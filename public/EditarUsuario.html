<!DOCTYPE html>
<html lang="pt-br">

<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/editarUsuario.css">
    <link rel="icon" href="assets/icon/logo-icon.png">
    <title>AirPulse - Editar Aeronaves</title>
    <link rel="stylesheet" href="css/painel.css">
</head>

<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="iconeAviao" viewBox="0 0 24 24">
            <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
        </symbol>
        <symbol id="iconeCheck" viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
        </symbol>
    </svg>

    <div class="appLayout">

        <aside id="sidebar">
            <div class="sidebarHeader">
                <a class="sidebarBrand" href="dashboardGeral.html">
                    <img class="brandLogoFull"
                        src="assets/AirPulse_Logo_Pack/Fundo transparente/07_Principal_Branco.svg" alt="AirPulse">
                </a>
            </div>

            <nav class="sidebarNav" aria-label="Menu principal"></nav>

            <div class="sidebarFooter">
                <div class="userProfile">
                    <div class="userAvatar" id="userAvatar">--</div>
                    <div class="userDetails">
                        <span class="userName" id="userNameDisplay">Usuário</span>
                        <span class="userRole" id="userRoleDisplay"></span>
                    </div>
                </div>

                <button class="btnLogout" type="button" onclick="limparSessao()" title="Encerrar sessão no sistema">
                    <i class="bi bi-box-arrow-right" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Deslogar</span>
                </button>
            </div>
        </aside>

        <div class="sidebarBackdrop" id="sidebarBackdrop"></div>
        <div class="mainWrapper">

            <header class="topbar">
                <div class="topbarLeft">
                    <button class="mobileToggle" id="mobileToggle" type="button" aria-label="Abrir menu">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                    <span class="topbarTitle">Editar Usuário</span>
                </div>
            </header>

            <main class="eaConteudo paginaInterna">

                <a href="gerenciarFuncionario.html" class="eaVoltar">← Voltar para usuários</a>
                <h1 class="eaTitulo">Editar aeronaves do Funcionário</h1>
                <p class="eaSubtitulo">Associe ou remova aeronaves sob a responsabilidade deste funcionário.</p>

                

                

                <div class="eaQuadro">
                    <div class="eaFuncionario">
                        <div class="eaAvatar" id="avatarFuncionario">--</div>
                        <div>
                            <span class="eaNomeFunc" id="nomeFuncionario">Carregando funcion&aacute;rio...</span>
                            <span class="eaEmailFunc" id="emailFuncionario">&mdash;</span>
                        </div>
                        <span class="eaStatus" id="statusFuncionario">&mdash;</span>
                        <span class="eaTotal" id="totalAeronaves">&mdash;</span>
                    </div>
                    <div class="eaFiltros">
                        <input type="text" class="eaBusca" id="buscaAeronaves" disabled
                            placeholder="Buscar aeronave, modelo ou identifica&ccedil;&atilde;o..."
                            aria-label="Buscar aeronave, modelo ou identifica&ccedil;&atilde;o">
                        <button type="button" class="eaFiltro ativo" data-associacao="TODAS" aria-pressed="true" disabled>Todas</button>
                        <button type="button" class="eaFiltro" data-associacao="ASSOCIADAS" aria-pressed="false" disabled>Associadas</button>
                        <button type="button" class="eaFiltro" data-associacao="DISPONIVEIS" aria-pressed="false" disabled>Dispon&iacute;veis</button>
                    </div>
                    <p class="eaMensagem" id="mensagemEdicao" role="status" aria-live="polite">Carregando aeronaves...</p>
                    <button type="button" class="eaBtnRecarregar" id="recarregarEdicao" hidden>Tentar novamente</button>
                    <div class="eaLista" id="listaAeronaves" aria-busy="true"></div>
                </div>

                <div class="eaRodape">
                    <span class="eaResumo" id="resumoAeronaves" aria-live="polite">Carregando associa&ccedil;&otilde;es...</span>
                    <div class="eaAcoes">
                        <button type="button" class="eaBtnGrande inativar" id="inativarFuncionario" disabled>Inativar funcion&aacute;rio</button>
                        <a href="gerenciarFuncionario.html" class="eaBtnGrande cancelar" id="cancelarEdicao">Cancelar</a>
                        <button type="button" class="eaBtnGrande salvar" id="salvarAeronaves" disabled>Salvar altera&ccedil;&otilde;es</button>
                    </div>
                </div>

            </main>
        </div>

    </div>

    <script src="js/sessao.js"></script>
    <script>validarSessao()</script>
    <script src="js/menuLateral.js"></script>
    <script src="js/funcionariosUi.js"></script>
    <script src="js/editarUsuario.js"></script>
    <script>iniciarEditarUsuario()</script>
</body>

</html>
