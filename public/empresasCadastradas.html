<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icon/logo-icon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastroEmpresa.css">
    <link rel="stylesheet" href="css/empresasCadastradas.css">
    <link rel="stylesheet" href="css/painel.css">
    <title>AirPulse - Empresas Cadastradas</title>
</head>

<body>

    <div class="appLayout">

        <aside id="sidebar">
            <div class="sidebarHeader">
                <a class="sidebarBrand" href="cadastroEmpresa.html">
                    <img class="brandLogoFull"
                        src="assets/AirPulse_Logo_Pack/Fundo transparente/07_Principal_Branco.svg" alt="AirPulse">
                </a>
            </div>

            <nav class="sidebarNav">
                <div class="navItem disabled">
                    <i class="bi bi-grid-1x2 navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Visão Geral</span>
                </div>

                <a href="cadastroEmpresa.html" class="navItem">
                    <i class="bi bi-building-add navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Cadastrar Empresa</span>
                </a>

                <a href="empresasCadastradas.html" class="navItem active" aria-current="page">
                    <i class="bi bi-buildings navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Empresas Cadastradas</span>
                </a>

                <div class="navItem disabled">
                    <i class="bi bi-question-circle navIcon" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Chamados & Suporte</span>
                </div>
            </nav>

            <div class="sidebarFooter">
                <div class="userProfile">
                    <div class="userAvatar" id="userAvatar">--</div>
                    <div class="userDetails">
                        <span class="userName" id="userNameDisplay">Usuário</span>
                        <span class="userRole" id="userRoleDisplay"></span>
                    </div>
                </div>

                <button class="btnLogout" type="button" onclick="limparSessao()" title="Encerrar sessão no sistema">
                    <i class="bi bi-box-arrow-right" style="font-size: 18px" aria-hidden="true"></i>
                    <span>Deslogar</span>
                </button>
            </div>
        </aside>

        <div class="sidebarBackdrop" id="sidebarBackdrop"></div>

        <div class="mainWrapper">

            <header class="topbar">
                <div class="topbarLeft">
                    <button class="mobileToggle" id="mobileToggle" type="button" aria-label="Abrir menu">
                        <i class="bi bi-list" aria-hidden="true"></i>
                    </button>
                    <span class="topbarTitle">Módulo de Cadastramento de Clientes</span>
                </div>
            </header>

            <main class="paginaInterna">

                <h1>Empresas Cadastradas</h1>

                <p class="subtitle">
                    Empresas clientes cadastradas na plataforma AirPulse.
                </p>

                <section class="card">
                    <div class="filtroEmpresas" role="group" aria-label="Filtrar empresas por status">
                        <button type="button" class="filtroEmpresa ativo" id="filtroATIVO" onclick="filtrar('ATIVO')">Ativas</button>
                        <button type="button" class="filtroEmpresa" id="filtroINATIVO" onclick="filtrar('INATIVO')">Inativas</button>
                        <button type="button" class="filtroEmpresa" id="filtroTODAS" onclick="filtrar('TODAS')">Todas</button>
                    </div>

                    <div class="empresaLinha cabecalhoTabela">
                        <div>Razão social</div>
                        <div>Nome fantasia</div>
                        <div>CNPJ</div>
                        <div>Segmento</div>
                        <div>Status</div>
                        <div>Ações</div>
                    </div>

                    <div id="linhasEmpresas"></div>

                    <p class="semEmpresas" id="semEmpresas" hidden>Nenhuma empresa encontrada.</p>
                </section>

            </main>
        </div>

    </div>

    <script src="js/sessao.js"></script>
    <script>validarSessao();</script>
    <script src="js/menuLateral.js"></script>
    <script src="js/empresasCadastradas.js"></script>
</body>

</html>
